name: Build Android App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository began as a desktop-only Flutter project and does not
      # commit platform scaffolding. Generate Android's standard Gradle project
      # in the runner so we can validate/build the Android target without
      # changing desktop project files.
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.noctune .

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          NOCTUNE_LASTFM_API_KEY: ${{ secrets.NOCTUNE_LASTFM_API_KEY }}
          NOCTUNE_LASTFM_API_SECRET: ${{ secrets.NOCTUNE_LASTFM_API_SECRET }}
        run: >-
          flutter build apk --release
          --dart-define=NOCTUNE_LASTFM_API_KEY="$NOCTUNE_LASTFM_API_KEY"
          --dart-define=NOCTUNE_LASTFM_API_SECRET="$NOCTUNE_LASTFM_API_SECRET"

      - name: Build Android App Bundle
        env:
          NOCTUNE_LASTFM_API_KEY: ${{ secrets.NOCTUNE_LASTFM_API_KEY }}
          NOCTUNE_LASTFM_API_SECRET: ${{ secrets.NOCTUNE_LASTFM_API_SECRET }}
        run: >-
          flutter build appbundle --release
          --dart-define=NOCTUNE_LASTFM_API_KEY="$NOCTUNE_LASTFM_API_KEY"
          --dart-define=NOCTUNE_LASTFM_API_SECRET="$NOCTUNE_LASTFM_API_SECRET"

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: Noctune-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: Noctune-Android-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
